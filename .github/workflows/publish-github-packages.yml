name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@saizul'
      - run: npm ci
      - run: npm test
      # The package is already named @saizul/cookie-consent-lite with
      # publishConfig.registry set to GitHub Packages; this check fails the
      # release early if either was changed by mistake.
      - name: Check the package name and registry
        run: |
          test "$(npm pkg get name)" = '"@saizul/cookie-consent-lite"'
          test "$(npm pkg get publishConfig.registry)" = '"https://npm.pkg.github.com"'
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Attach the <script> build to the release so sites can self-host it.
      - name: Upload cookie-consent.min.js to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/cookie-consent.min.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
